# Trusted Publishing (OIDC) for @ameshkin/nextcrumbs.
# npmjs.com Trusted Publisher must match:
#   Organization/user: ameshkin
#   Repository: nextcrumbs
#   Workflow filename: publish.yml
#   Environment name: (leave empty; this job does not set `environment:`)
# Requires npm CLI >= 11.5.1 and Node >= 22.14 on the runner.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: npm publish (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          # Never cache package manager for release builds
          cache: npm

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node -v
          npm -v

      - name: Install
        run: npm ci

      - name: CI checks
        run: npm run ci

      - name: Verify jsonld stays server-safe (no use client)
        run: |
          set -euo pipefail
          head -n 1 dist/utils/jsonld.js | grep -vq 'use client'
          head -n 1 dist/utils/buildPathBreadcrumbs.js | grep -vq 'use client'
          head -n 1 dist/Breadcrumbs.js | grep -q 'use client'

      - name: Publish
        # Trusted publishing authenticates via OIDC. Do not set NODE_AUTH_TOKEN
        # (empty or otherwise). An empty token makes npm skip OIDC and fail ENEEDAUTH.
        run: npm publish --access public
