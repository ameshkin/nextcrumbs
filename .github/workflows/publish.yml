# Trusted Publishing (OIDC) for @ameshkin/nextcrumbs.
# npmjs.com Trusted Publisher must match:
#   Organization/user: ameshkin
#   Repository: nextcrumbs
#   Workflow filename: publish.yml
#   Environment name: (leave empty; this job does not set `environment:`)
#   Allowed actions: include direct npm publish (not stage-only)
# Requires npm CLI >= 11.5.1 and Node >= 22.14 on the runner.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: npm publish (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Do NOT pass registry-url. setup-node writes an empty _authToken line that
      # makes npm skip OIDC and fail with ENEEDAUTH / E404.
      # See: https://github.com/actions/setup-node/issues/1551
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node -v
          npm -v

      - name: Install
        run: npm ci

      - name: CI checks
        run: npm run ci

      - name: Verify jsonld stays server-safe (no use client)
        run: |
          set -euo pipefail
          head -n 1 dist/utils/jsonld.js | grep -vq 'use client'
          head -n 1 dist/utils/buildPathBreadcrumbs.js | grep -vq 'use client'
          head -n 1 dist/Breadcrumbs.js | grep -q 'use client'

      - name: Strip any leftover _authToken (OIDC must not see classic auth)
        run: |
          set -euo pipefail
          for npmrc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            if [ -n "${npmrc}" ] && [ -f "${npmrc}" ]; then
              sed -i '/_authToken/d' "${npmrc}" || true
            fi
          done

      - name: Publish
        run: npm publish --access public
