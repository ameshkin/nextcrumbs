# Trusted Publishing (OIDC) for @ameshkin/nextcrumbs.
# npmjs.com Trusted Publisher must match EXACTLY:
#   Organization/user: ameshkin
#   Repository: nextcrumbs
#   Workflow filename: publish.yml
#   Environment name: (empty; this job does not set `environment:`)
#   Allowed actions: must include direct "npm publish" (not stage-only)
# Do not use setup-node registry-url (empty _authToken blocks OIDC).
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: npm publish (OIDC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Ensure npm supports OIDC trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          node -v
          npm -v

      - name: Install
        run: npm ci

      - name: CI checks
        run: npm run ci

      - name: Verify jsonld stays server-safe (no use client)
        run: |
          set -euo pipefail
          head -n 1 dist/utils/jsonld.js | grep -vq 'use client'
          head -n 1 dist/utils/buildPathBreadcrumbs.js | grep -vq 'use client'
          head -n 1 dist/Breadcrumbs.js | grep -q 'use client'

      - name: OIDC preflight
        run: |
          set -euo pipefail
          echo "ACTIONS_ID_TOKEN_REQUEST_URL set: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN set: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+yes}"
          echo "repository.url=$(node -p 'require("./package.json").repository.url')"
          echo "workflow=publish.yml"
          for npmrc in "${NPM_CONFIG_USERCONFIG:-}" "$HOME/.npmrc" .npmrc; do
            if [ -n "${npmrc}" ] && [ -f "${npmrc}" ]; then
              echo "--- ${npmrc} ---"
              sed '/_authToken/d' "${npmrc}" > "${npmrc}.oidc" && mv "${npmrc}.oidc" "${npmrc}"
              cat "${npmrc}" || true
            fi
          done

      - name: Publish
        run: npm publish --access public --loglevel verbose
